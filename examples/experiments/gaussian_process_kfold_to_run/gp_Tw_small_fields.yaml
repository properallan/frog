fr_model_builder: FlowReconstruction
save_results: ./gp_Tw_small_fields/
params:
  HF_VARIABLES:
  - Pressure
  - Temperature
  - Mach
  LF_VARIABLES:
  - p
  - T
  - M
  - S
  - T_wall
  TEST_X: ../../datasets/Tw_small/test_X.npz
  TEST_y: ../../datasets/Tw_small/test_y.npz
  TRAINING_X: ../../datasets/Tw_small/training_X.npz
  TRAINING_y: ../../datasets/Tw_small/training_y.npz
  N_COMPONENTS_X: 14
  N_COMPONENTS_y: 76
  metrics:
    NRMSE: NRMSE
    R2: R2
  regressor: GaussianProcessRegressor(kernel=ConstantKernel(1.0, (1e-3, 1e3)) * RBF(length_scale=[1.0]*params['N_COMPONENTS_X'], length_scale_bounds=(1e-9, 1e9)), n_restarts_optimizer=10, normalize_y=False,  random_state=42)
  X_rom: Pipeline([ ('centering', SliceMeanCentering()), ('scaler', MaxAbsScaler() ), ('reducer', IncrementalPCA(n_components=params['N_COMPONENTS_X'])) ])
  y_rom: Pipeline([ ('centering', SliceMeanCentering()), ('scaler', MaxAbsScaler() ), ('reducer', IncrementalPCA(n_components=params['N_COMPONENTS_y'])) ])
kfold_cross_validation:
  n_splits: 5
  shuffle: True
  random_state: 42